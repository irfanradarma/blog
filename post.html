<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Irfan Radarma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white:    #ffffff;
      --off:      #f5f5f7;
      --ink:      #1d1d1f;
      --mid:      #6e6e73;
      --soft:     #a1a1a6;
      --rule:     #d2d2d7;
      --orange:   #ea580c;
      --orange-h: #c2410c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      background: var(--white);
      color: var(--ink);
      font-family: 'IBM Plex Sans', -apple-system, sans-serif;
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: 52px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      display: flex; align-items: center;
    }
    .nav-inner {
      width: 100%; max-width: 1200px; margin: 0 auto;
      padding: 0 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-size: 0.95rem; font-weight: 600;
      color: var(--ink); text-decoration: none;
      letter-spacing: -0.01em;
    }
    .nav-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.82rem; font-weight: 500;
      color: var(--orange); text-decoration: none;
      transition: color 0.15s;
    }
    .nav-back:hover { color: var(--orange-h); }
    .nav-back svg { width: 16px; height: 16px; }

    /* ── STATES ── */
    #state-loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      font-size: 0.88rem; font-weight: 400; color: var(--soft);
    }
    #state-error {
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 20px; min-height: 100vh;
      text-align: center; padding: 32px;
    }
    .error-title {
      font-size: 1.3rem; font-weight: 600;
      color: var(--ink); letter-spacing: -0.02em;
    }
    .error-sub { font-size: 0.9rem; color: var(--mid); }
    .error-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 12px 24px; background: var(--orange); color: #fff;
      font-size: 0.85rem; font-weight: 500;
      border-radius: 0; /* Sharp edge */
      text-decoration: none;
      transition: background 0.2s;
    }
    .error-link:hover { background: var(--orange-h); }

    /* ── POST ── */
    #post { display: none; }

    /* Header */
    .post-header {
      padding-top: 52px;
      background: var(--off);
      border-bottom: 1px solid var(--rule);
    }
    .post-header-inner {
      max-width: 760px; margin: 0 auto;
      padding: 72px 32px 56px;
    }
    .post-cat {
      display: inline-block;
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--orange); margin-bottom: 20px;
    }
    .post-title {
      font-size: clamp(1.9rem, 4.5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 32px;
    }
    .post-meta {
      display: flex; align-items: center; gap: 0; flex-wrap: wrap;
      border-top: 1px solid var(--rule);
      padding-top: 20px;
    }
    .meta-chip {
      font-size: 0.78rem; font-weight: 400; color: var(--mid);
      padding-right: 20px; margin-right: 20px;
      border-right: 1px solid var(--rule);
    }
    .meta-chip:last-child { border-right: none; padding-right: 0; margin-right: 0; }

    /* Body */
    .post-body {
      max-width: 760px; margin: 0 auto;
      padding: 60px 32px 80px;
    }

    /* ── PROSE STYLES ── */
    .post-body p {
      font-size: 1.02rem;
      font-weight: 300;
      color: var(--mid);
      line-height: 1.88;
      margin-bottom: 1.4rem;
    }
    .post-body p strong {
      color: var(--ink); font-weight: 600;
    }
    .post-body p em { font-style: italic; }

    .post-body h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin: 3rem 0 0.9rem;
      line-height: 1.25;
    }
    .post-body h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--ink);
      margin: 2.2rem 0 0.7rem;
    }

    .post-body ul, .post-body ol {
      margin: 0 0 1.4rem 1.5rem;
      color: var(--mid);
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.85;
    }
    .post-body li { margin-bottom: 0.45rem; }
    .post-body li strong { color: var(--ink); font-weight: 600; }

    .post-body blockquote {
      margin: 2.5rem 0;
      padding: 24px 28px;
      background: var(--off);
      border-left: 3px solid var(--orange);
      border-radius: 0; /* Sharp edge */
      font-size: 1.08rem;
      font-weight: 300;
      font-style: italic;
      color: var(--ink);
      line-height: 1.65;
    }

    .post-body hr {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 3rem 0;
    }

    /* Author footer inside body */
    .post-footer {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--rule);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 20px;
    }
    .author-avatar {
      width: 44px; height: 44px; border-radius: 0; /* Sharp edge */
      background: var(--off);
      border: 1px solid var(--rule);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700; color: var(--orange);
      flex-shrink: 0;
    }
    .author-info { display: flex; align-items: center; gap: 14px; }
    .author-name {
      font-size: 0.9rem; font-weight: 600;
      color: var(--ink); letter-spacing: -0.01em;
    }
    .author-title {
      font-size: 0.76rem; font-weight: 400; color: var(--mid);
      margin-top: 2px;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px;
      background: transparent;
      border: 1.5px solid var(--rule);
      border-radius: 0; /* Sharp edge */
      font-size: 0.82rem; font-weight: 500;
      color: var(--ink); text-decoration: none;
      transition: border-color 0.18s, color 0.18s;
    }
    .back-btn:hover { border-color: var(--orange); color: var(--orange); }

    /* Footer */
    footer {
      background: var(--off);
      border-top: 1px solid var(--rule);
      padding: 24px 32px;
    }
    .footer-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 8px;
    }
    .footer-copy, .footer-right {
      font-size: 0.75rem; font-weight: 400; color: var(--soft);
    }

    /* Fade in */
    .fade { opacity: 0; transform: translateY(16px); transition: opacity 0.55s ease, transform 0.55s ease; }
    .fade.in { opacity: 1; transform: none; }

    @media (max-width: 600px) {
      .post-header-inner, .post-body { padding-left: 20px; padding-right: 20px; }
      .nav-inner { padding: 0 20px; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">Irfan Radarma</a>
    <a class="nav-back" href="index.html#blog">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 3L5 8l5 5"/>
      </svg>
      All posts
    </a>
  </div>
</nav>

<!-- Loading -->
<div id="state-loading">Loading…</div>

<!-- Error -->
<div id="state-error">
  <div class="error-title">Post not found</div>
  <div class="error-sub">The article you're looking for doesn't exist or has been moved.</div>
  <a class="error-link" href="index.html#blog">← Back to blog</a>
</div>

<!-- Post -->
<div id="post">
  <div class="post-header">
    <div class="post-header-inner">
      <div class="post-cat fade" id="post-cat"></div>
      <h1 class="post-title fade" id="post-title"></h1>
      <div class="post-meta fade">
        <span class="meta-chip" id="post-date"></span>
        <span class="meta-chip" id="post-cat-meta"></span>
        <span class="meta-chip">Teuku Raja Irfan Radarma</span>
      </div>
    </div>
  </div>

  <div class="post-body fade" id="post-body"></div>

  <footer>
    <div class="footer-inner">
      <span class="footer-copy">© 2025 Teuku Raja Irfan Radarma. All rights reserved.</span>
      <span class="footer-right">Jakarta, Indonesia</span>
    </div>
  </footer>
</div>

<script>
  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  async function loadPost() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('post');
    if (!slug) { showError(); return; }
    try {
      const res = await fetch(`blog/${slug}.json`);
      if (!res.ok) throw new Error('not found');
      const data = await res.json();
      renderPost(data);
    } catch {
      showError();
    }
  }

  function renderPost(data) {
    document.title = `${data.title} — Irfan Radarma`;

    document.getElementById('post-cat').textContent      = data.category;
    document.getElementById('post-title').textContent    = data.title;
    document.getElementById('post-date').textContent     = formatDate(data.date);
    document.getElementById('post-cat-meta').textContent = data.category;

    document.getElementById('post-body').innerHTML = data.body + `
      <div class="post-footer">
        <div class="author-info">
          <div class="author-avatar">IR</div>
          <div>
            <div class="author-name">Teuku Raja Irfan Radarma</div>
            <div class="author-title">IT Auditor &amp; Data Specialist · Ministry of Finance, Indonesia</div>
          </div>
        </div>
        <a class="back-btn" href="index.html#blog">← All posts</a>
      </div>`;

    document.getElementById('state-loading').style.display = 'none';
    document.getElementById('post').style.display = 'block';

    requestAnimationFrame(() => {
      document.querySelectorAll('.fade').forEach((el, i) => {
        setTimeout(() => el.classList.add('in'), i * 80);
      });
    });
  }

  function showError() {
    document.getElementById('state-loading').style.display = 'none';
    document.getElementById('state-error').style.display   = 'flex';
  }

  loadPost();
</script>
</body>
</html>
